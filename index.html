<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ornitho Quiz</title>
<meta name="description" content="Révisions ludiques du MOOC Ornitho">
<meta name="theme-color" content="#1f3a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ornitho">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f4efe3; --paper:#fffaf0; --ink:#1d2a22; --muted:#6b6a5c; --line:#e2d9c4;
  --forest:#1f3a2e; --moss:#3f6b4f; --rust:#c85f33; --sun:#e0a63f; --good:#2f7d4f; --bad:#b8432c;
  --shadow:0 1px 0 rgba(0,0,0,.04),0 6px 18px -10px rgba(31,58,46,.35);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121915; --paper:#1a241e; --ink:#ece6d6; --muted:#9a9a88; --line:#2c3a31;
  --forest:#0d1611; --moss:#86b596; --rust:#e17a4e; --sun:#e8b04b; --good:#5bbd80; --bad:#e46b52;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
#app{max-width:560px;margin:0 auto;padding:0 16px 40px}
h1,h2,h3,.rname,.prompt,.end h1{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
h1{font-size:24px;margin:0;line-height:1.2}
h2{font-size:19px;margin:28px 0 10px}
h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;font-family:inherit}
.muted{color:var(--muted)} .small{font-size:13.5px} i{font-style:italic}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:11px 16px;font-weight:600;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);display:inline-block;text-align:center}
.btn.primary{background:var(--rust);border-color:var(--rust);color:#fff}
.btn.danger{color:var(--bad)} .btn.small{padding:7px 12px;font-size:14px;margin-top:6px} .btn.wide{width:100%;margin-top:12px}
.link{color:var(--moss);text-decoration:underline;padding:0;font-size:inherit}
.hero{background:var(--forest);color:#f2ead8;margin:0 -16px;padding:calc(18px + env(safe-area-inset-top)) 20px 18px;border-radius:0 0 22px 22px}
.rank{display:flex;align-items:center;gap:12px}.ricon{font-size:38px}
.rname{font-size:24px}.rsub{opacity:.75;font-size:14px}
.streak{margin-left:auto;background:rgba(255,255,255,.1);padding:6px 11px;border-radius:20px;font-weight:700}
.bar{height:10px;background:rgba(127,127,100,.25);border-radius:9px;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--rust));border-radius:9px;transition:width .5s}
.bar.thin{height:8px;margin:0;flex:1}
.rnext{font-size:13px;opacity:.75;margin-top:6px}
.goal{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:16px;box-shadow:var(--shadow)}
.goal .btn{margin-left:auto}
.ring{--p:0;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--good) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{background:var(--paper);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:3px;min-height:118px}
.tile .ti{font-size:26px}.tile small{color:var(--muted);font-size:12.5px;line-height:1.3}.tile em{font-style:normal;font-size:12px;color:var(--rust);font-weight:700;margin-top:auto}
.tile:active,.chap:active,.opt:active{transform:scale(.98)}
.chapters{display:grid;gap:8px}
.chap{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:11px 14px;display:grid;grid-template-columns:1fr auto;text-align:left;gap:2px 8px}
.chap>span:first-child{font-weight:600}.stars{color:var(--sun);letter-spacing:2px}.stars i{color:var(--line);font-style:normal}
.chap small{color:var(--muted);font-size:12.5px}.mbar{grid-column:1/-1;height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px}.mbar i{display:block;height:100%;background:var(--moss)}
.row2{display:flex;gap:10px;flex-wrap:wrap}.row2 .btn{flex:1}
.foot{margin-top:28px;text-align:center}
.top{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 0 6px}
.back{font-size:26px;width:40px;height:40px;border-radius:50%;background:var(--paper);border:1px solid var(--line);line-height:1;flex:none}
.qtop{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 0 12px;position:sticky;top:0;background:var(--bg);z-index:3}
.qtop .back{font-size:18px;width:36px;height:36px}
.combo{font-weight:800;color:var(--rust);min-width:42px;text-align:right}.combo.ghost{color:var(--muted);font-weight:600;font-size:14px}
.photo-wrap{background:var(--forest);border-radius:16px;overflow:hidden;position:relative;min-height:120px}
.photo-wrap img{display:block;width:100%;max-height:52vh;object-fit:contain;background:#0c120e}
.photo-wrap.small img{max-height:30vh}
.credit{font-size:11px;color:#d8d2c0;padding:6px 10px;background:rgba(0,0,0,.45)}
.credit a,.credit .link{color:#f2ead8;font-size:11px}
.ph-loading,.ph-none{color:#cfc9b6;padding:40px 16px;text-align:center;font-size:14px}
.prompt{font-size:21px;margin:16px 0 4px;line-height:1.25}
.hint{color:var(--muted);font-size:13px;margin:0 0 6px}
blockquote{margin:12px 0;padding:12px 14px;background:var(--paper);border-left:4px solid var(--sun);border-radius:4px 12px 12px 4px;font-family:"Iowan Old Style",Georgia,serif;font-size:16.5px}
.opts{display:grid;gap:9px;margin-top:14px}
.opt{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:14px;text-align:left;font-weight:600;transition:.15s}
.opt.it{font-style:italic;font-weight:500}
.opt.good{background:var(--good);border-color:var(--good);color:#fff}
.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff;animation:shake .35s}
.opt.dim{opacity:.45}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fbcard{margin-top:16px;padding:14px;border-radius:16px;background:var(--paper);border:1px solid var(--line);border-top:5px solid var(--good)}
.fbcard.ko{border-top-color:var(--bad)}
.fbh{font-weight:800;font-size:17px;margin-bottom:8px}.fbcard.ok .fbh{color:var(--good)}.fbcard.ko .fbh{color:var(--bad)}
.fbcard p{margin:8px 0}.fbcard .photo-wrap{margin:6px 0 10px}
.path{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12.5px;margin:6px 0}
.path span{background:rgba(63,107,79,.12);color:var(--moss);padding:3px 8px;border-radius:20px;font-weight:600}
.path b{color:var(--muted);font-weight:400}
.end{text-align:center;padding-top:calc(30px + env(safe-area-inset-top))}
.end .big{font-size:64px}.end h1{font-size:40px}.end .splist{text-align:left}.end .row2{margin-top:22px}
.newstar{font-size:34px;color:var(--sun);margin:10px 0;font-weight:800}.newstar small{font-size:14px;color:var(--ink)}
.splist{display:grid;gap:6px}
.sprow{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;text-align:left;gap:10px}
.sprow small{color:var(--muted)}.sprow i{color:var(--muted);font-size:13px}
.dots{display:flex;gap:3px;flex:none}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--moss)}
.dot.new{font-size:11px;color:var(--rust);font-weight:700;flex:none}
.levels{display:grid;gap:8px;margin-top:12px}
.level{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column}
.level small{color:var(--muted)}.level.done{border-color:var(--sun)}.level.locked{opacity:.5}
.block{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}
.block h4{margin:0 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.block p{margin:4px 0}
.block.fam{border-left:4px solid var(--moss)}
.sci{font-style:italic;color:var(--muted);margin:0 0 10px 50px}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;margin:8px 0}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.badge{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;opacity:.4;filter:grayscale(1);display:flex;flex-direction:column}
.badge.on{opacity:1;filter:none;border-color:var(--sun)}.badge span{font-size:30px}.badge small{color:var(--muted)}
.timer{position:relative;height:30px;background:var(--line);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-weight:700;font-size:14px}
.timer i{position:absolute;left:0;top:0;bottom:0;background:var(--sun);transition:width .2s linear;z-index:0}.timer span,.timer b{position:relative}
.pairs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.pc{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 6px;min-height:78px;font-size:13.5px;font-weight:600;line-height:1.2}
.pc.fam{background:rgba(63,107,79,.1)}.pc.sci{font-style:italic;font-weight:500;background:rgba(224,166,63,.12)}
.pc.sel{border-color:var(--rust);box-shadow:0 0 0 2px var(--rust)}
.pc.found{background:var(--good);color:#fff;border-color:var(--good);opacity:.55}
.pc.shake{animation:shake .35s;border-color:var(--bad)}
.ladder{display:flex;gap:6px;flex:1}.ladder i{flex:1;height:8px;border-radius:5px;background:var(--line)}.ladder i.on{background:var(--good)}.ladder i.cur{background:var(--sun)}
.center{display:grid;place-items:center;min-height:70vh;text-align:center}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--rust);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:var(--forest);color:#f2ead8;padding:11px 18px;border-radius:24px;opacity:0;transition:.35s;z-index:20;font-weight:600;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}.toast.big{font-size:18px;padding:16px 22px;background:var(--rust)}
</style>
</head>
<body>
<main id="app"><div class="center"><div class="spinner"></div></div></main>
<script src="app.js"></script>
</body>
</html>
