<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ornitho Quiz</title>
<meta name="description" content="Révisions ludiques du MOOC Ornitho">
<meta name="theme-color" content="#3d4f63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ornitho">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=League+Gothic&display=swap" rel="stylesheet">
<style>
/* Charte commune OenoLab / LeCultureClub : ardoise + rouge vermillon, fond papier, angles droits, titres League Gothic */
:root{
  --bg:#fafaf7; --paper:#ffffff; --ink:#1a1a1a; --slate:#3d4f63; --red:#e8401c; --muted:#6b7785; --line:#e6e4dc; --soft:#f1efe8;
  --good:#2e7d4f; --bad:#e8401c; --gold:#d9a521; --goodbg:#e3f1e8; --badbg:#fde8e2;
  --display:"League Gothic","Oswald","Arial Narrow",sans-serif; --body:Inter,ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141a21; --paper:#1b232c; --ink:#eceae4; --slate:#a9bccf; --red:#ff5a36; --muted:#94a0ad; --line:#2a3440; --soft:#212a34; --good:#58b97e; --bad:#ff5a36; --goodbg:#18301f; --badbg:#3a1d16; color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
#app{max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 48px}
h1,h2,.rname,.prompt,.end h1,.wordmark,.tile b,.level b,.chap>span:first-child,.badge b,.fbh{font-family:var(--display);font-weight:400;text-transform:uppercase;letter-spacing:.02em;color:var(--slate)}
h1{font-size:34px;margin:0;line-height:1}
h2{font-size:28px;margin:34px 0 12px;line-height:1}
h3{font:600 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:20px 0 10px}
.muted{color:var(--muted)} .small{font-size:13.5px} i{font-style:italic}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.btn{background:var(--paper);border:1.5px solid var(--slate);color:var(--slate);border-radius:0;padding:11px 16px;font:600 13px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;display:inline-block;text-align:center}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger{color:var(--red);border-color:var(--red)} .btn.small{padding:8px 12px;font-size:12px;margin-top:8px} .btn.wide{width:100%;margin-top:14px}
.link{color:var(--red);text-decoration:underline;padding:0;font-size:inherit}
/* En-tête */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 0 12px;border-bottom:1px solid var(--line);margin:0 -16px;padding-left:16px;padding-right:16px;background:var(--paper)}
.wordmark{font-size:30px;line-height:1;display:flex;align-items:center;gap:10px}.wordmark em{font-style:normal;color:var(--red)}
.wordmark img{width:34px;height:34px}
.streak{font:700 13px var(--body);color:var(--slate);border:1.5px solid var(--slate);padding:5px 10px;letter-spacing:.04em}
.hero{padding:22px 0 6px}
.rank{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.rname{font-size:44px;line-height:.95}.rname em{font-style:normal;color:var(--red)}
.rsub{font:600 11px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.bar{height:6px;background:var(--line);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:var(--red);transition:width .5s}
.bar.thin{height:4px;margin:0;flex:1}
.rnext{font-size:13px;color:var(--muted);margin-top:8px}
.goal{display:flex;align-items:center;gap:14px;background:var(--slate);color:#fff;padding:16px;margin-top:18px}
.goal b{font:400 24px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}.goal .muted{color:#c9d3dd;font-size:13px}
.goal .btn{margin-left:auto;border-color:var(--red)}
.ring{--p:0;width:56px;height:56px;border-radius:50%;background:conic-gradient(var(--red) calc(var(--p)*1%),rgba(255,255,255,.18) 0);display:grid;place-items:center;flex:none}
.ring span{background:var(--slate);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--body);color:#fff}
@media (prefers-color-scheme:dark){.goal{background:#2a3644}.ring span{background:#2a3644}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line)}
.tile{background:var(--paper);padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:132px;position:relative}
.tile .ti{width:30px;height:30px;color:var(--slate);margin-bottom:6px}.tile .ti svg{width:100%;height:100%}
.tile b{font-size:23px;line-height:1}
.tile small{color:var(--muted);font-size:12.5px;line-height:1.35}
.tile em{font:700 11px var(--body);font-style:normal;color:var(--red);letter-spacing:.1em;text-transform:uppercase;margin-top:auto;padding-top:6px}
.tile:active,.chap:active,.opt:active,.level:active{background:var(--soft)}
.chapters{display:grid;border-top:1px solid var(--line)}
.chap{background:transparent;border-bottom:1px solid var(--line);padding:13px 2px;display:grid;grid-template-columns:1fr auto;text-align:left;gap:3px 10px}
.chap>span:first-child{font-size:22px;line-height:1.05}
.stars{color:var(--red);letter-spacing:3px;font-size:14px}.stars i{color:var(--line);font-style:normal}
.chap small{color:var(--muted);font-size:12.5px}
.mbar{grid-column:1/-1;height:3px;background:var(--line);overflow:hidden;margin-top:6px}.mbar i{display:block;height:100%;background:var(--slate)}
.row2{display:flex;gap:10px;flex-wrap:wrap}.row2 .btn{flex:1}
.foot{margin-top:32px;text-align:center;font-size:12.5px}
.top{display:flex;align-items:center;gap:12px;padding:calc(16px + env(safe-area-inset-top)) 0 10px}
.back{font-size:22px;width:38px;height:38px;border:1.5px solid var(--slate);color:var(--slate);line-height:1;flex:none;display:grid;place-items:center}
.qtop{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 0 12px;position:sticky;top:0;background:var(--bg);z-index:3}
.qtop .back{font-size:16px;width:34px;height:34px}
.qtop>b{font:400 20px var(--display);text-transform:uppercase;color:var(--slate)}
.combo{font:400 24px var(--display);color:var(--red);min-width:42px;text-align:right}.combo.ghost{color:var(--muted);font:600 12px var(--body);letter-spacing:.1em}
.photo-wrap{background:#1f2a35;overflow:hidden;position:relative;min-height:120px}
.photo-wrap img{display:block;width:100%;max-height:52vh;object-fit:contain;background:#141a21}
.photo-wrap.small img{max-height:30vh}
.credit{font-size:10.5px;color:#d5dbe1;padding:6px 10px;background:#1f2a35}
.credit a,.credit .link{color:#fff;font-size:10.5px}
.ph-loading,.ph-none{color:#aab6c2;padding:40px 16px;text-align:center;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.prompt{font-size:32px;margin:18px 0 6px;line-height:1}
.hint{color:var(--muted);font:600 11px var(--body);letter-spacing:.14em;text-transform:uppercase;margin:0 0 6px}
blockquote{margin:14px 0;padding:14px 16px;background:var(--paper);border-left:4px solid var(--red);font-size:16px;line-height:1.55}
.opts{display:grid;gap:8px;margin-top:16px}
.opt{background:var(--paper);border:1.5px solid var(--line);padding:15px 16px;text-align:left;font-weight:600;transition:background .15s,border-color .15s}
.opt.it{font-style:italic;font-weight:500}
.opt.good{background:var(--good);border-color:var(--good);color:#fff}
.opt.bad{background:var(--red);border-color:var(--red);color:#fff;animation:shake .35s}
.opt.dim{opacity:.4}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.fbcard{margin-top:18px;padding:16px;background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--good)}
.fbcard.ko{border-top-color:var(--red)}
.fbh{font-size:28px;line-height:1;margin-bottom:10px}.fbcard.ok .fbh{color:var(--good)}.fbcard.ko .fbh{color:var(--red)}
.fbcard p{margin:8px 0}.fbcard .photo-wrap{margin:6px 0 12px}
.path{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11px;margin:8px 0}
.path span{border:1px solid var(--slate);color:var(--slate);padding:3px 8px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.path b{color:var(--muted);font-weight:400}
.end{text-align:center;padding-top:calc(34px + env(safe-area-inset-top))}
.end .big{font:400 22px var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.end h1{font-size:88px;color:var(--slate)}.end .splist{text-align:left}.end .row2{margin-top:24px}
.newstar{font:400 40px var(--display);color:var(--red);margin:12px 0}.newstar small{font:600 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.splist{display:grid;border-top:1px solid var(--line)}
.sprow{background:transparent;border-bottom:1px solid var(--line);padding:11px 2px;display:flex;align-items:center;justify-content:space-between;text-align:left;gap:10px}
.sprow small{color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase}.sprow i{color:var(--muted);font-size:13px}
.dots{display:flex;gap:3px;flex:none}.dots i{width:8px;height:8px;background:var(--line)}.dots i.on{background:var(--slate)}
.dot.new{font:700 10px var(--body);color:var(--red);letter-spacing:.12em;text-transform:uppercase;flex:none}
.levels{display:grid;gap:8px;margin-top:14px}
.level{background:var(--paper);border:1.5px solid var(--line);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px}
.level b{font-size:24px;line-height:1}.level small{color:var(--muted)}.level.done{border-color:var(--red)}.level.locked{opacity:.45}
.block{background:var(--paper);border:1px solid var(--line);padding:14px 16px;margin-top:12px}
.block h4{margin:0 0 8px;font:600 11px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.block p{margin:4px 0}
.block.fam{border-left:4px solid var(--slate)}
.sci{font-style:italic;color:var(--muted);margin:0 0 12px 50px}
.search{width:100%;padding:13px 14px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;margin:8px 0;border-radius:0}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:12px}
.badge{background:var(--paper);padding:16px;text-align:center;opacity:.4;filter:grayscale(1);display:flex;flex-direction:column;gap:2px}
.badge.on{opacity:1;filter:none}.badge span{font-size:28px}.badge b{font-size:22px}.badge small{color:var(--muted);font-size:12px}
.timer{position:relative;height:28px;background:var(--line);overflow:hidden;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font:700 13px var(--body)}
.timer i{position:absolute;left:0;top:0;bottom:0;background:var(--red);opacity:.85;transition:width .2s linear;z-index:0}.timer span,.timer b{position:relative}
.pairs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.pc{background:var(--paper);border:1.5px solid var(--line);padding:10px 6px;min-height:80px;font-size:13px;font-weight:600;line-height:1.2}
.pc.fam{color:var(--slate);text-transform:uppercase;letter-spacing:.06em;font-size:11.5px}.pc.sci{font-style:italic;font-weight:500;color:var(--slate)}
.pc.sel{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.pc.found{background:var(--slate);color:#fff;border-color:var(--slate);opacity:.35}
.pc.shake{animation:shake .35s;border-color:var(--red)}
.ladder{display:flex;gap:4px;flex:1}.ladder i{flex:1;height:4px;background:var(--line)}.ladder i.on{background:var(--slate)}.ladder i.cur{background:var(--red)}
.center{display:grid;place-items:center;min-height:70vh;text-align:center}
.spinner{width:40px;height:40px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--red);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:var(--slate);color:#fff;padding:12px 18px;opacity:0;transition:.35s;z-index:20;font:600 13px var(--body);letter-spacing:.04em;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}.toast.big{font:400 24px var(--display);text-transform:uppercase;padding:14px 22px;background:var(--red)}
.why{margin:4px 0 10px;font-size:15px}
.duo{display:grid;gap:8px;margin:8px 0}
.duo>div{padding:10px 12px;font-size:14px;line-height:1.45;border-left:4px solid var(--line);background:var(--soft)}
.duo small{display:block;font:600 10.5px var(--body);letter-spacing:.12em;text-transform:uppercase;margin-bottom:3px}
.duo .w{border-left-color:var(--red)}.duo .w small{color:var(--red)}.duo .r{border-left-color:var(--good)}.duo .r small{color:var(--good)}
.cmpwrap{overflow-x:auto;margin:8px 0}
.cmp{width:100%;border-collapse:collapse;font-size:13.5px;line-height:1.35;table-layout:fixed}
.cmp th,.cmp td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp thead th{font:600 13px var(--body);color:var(--ink)}
.cmp thead th small,.cmp tbody th small{display:block;font:600 9.5px var(--body);letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.cmp thead th.w small{color:var(--red)}.cmp thead th.r small{color:var(--good)}
.cmp tbody th{width:28%;font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cmp tr.key{background:var(--soft)}.cmp tr.key th{color:var(--slate)}.cmp tr.key th small{color:var(--red)}
.cmp tr.key td{font-weight:600}
.retiens{margin:10px 0 4px;padding:10px 12px;border:1.5px solid var(--slate);font-size:14px}
.retiens b{display:block;font:400 18px var(--display);text-transform:uppercase;color:var(--slate);margin-bottom:2px}
.clues{display:grid;gap:6px;margin:10px 0}
.clue{background:var(--paper);border-left:4px solid var(--slate);padding:9px 12px;font-size:15px}
.clue:last-child{border-left-color:var(--red)}
.clue small{display:block;font:600 10.5px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.readorder{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0}
.readorder small{width:100%;font:600 10.5px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.readorder span{border:1.5px solid var(--slate);color:var(--slate);padding:5px 9px;font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center}
.readorder span b{color:var(--red)}
.duels{display:grid;gap:0}
.sosph{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.sosph figure{margin:0}.sosph figcaption{font-size:12.5px;font-weight:600;margin-top:4px}
.sosph .photo-wrap{min-height:90px}.sosph img{max-height:140px;object-fit:cover}
.dimblock p{margin:6px 0;font-size:14px}.dimblock p b{display:block;font-size:12px;color:var(--slate);text-transform:uppercase;letter-spacing:.06em}
.pswitch{margin:10px 0}
.ptabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin-top:6px}
.ptab{border:1.5px solid var(--line);background:var(--paper);padding:8px 10px;text-align:left;font-weight:600;font-size:14px;line-height:1.2}
.ptab small{display:block;font:600 10px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.ptab.w small{color:var(--red)}.ptab.r small{color:var(--good)}
.ptab.on{border-color:var(--slate);box-shadow:inset 0 0 0 1px var(--slate)}
.ptab.w.on{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}.ptab.r.on{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.ptip{margin:4px 0 0}
.play{display:inline-flex;align-items:center;gap:10px;border:1.5px solid var(--slate);background:var(--paper);color:var(--slate);padding:10px 14px;font:600 14px var(--body);margin:6px 6px 0 0;text-align:left}
.play i{width:0;height:0;border-left:11px solid currentColor;border-top:7px solid transparent;border-bottom:7px solid transparent;flex:none}
.play.playing i{width:11px;height:13px;border:0;border-left:4px solid currentColor;border-right:4px solid currentColor}
.play.loading{opacity:.6}
.play.big{width:100%;justify-content:center;background:var(--slate);color:#fff;border-color:var(--slate);padding:16px;font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin:12px 0 0}
.play.w{border-color:var(--red);color:var(--red)}.play.r{border-color:var(--good);color:var(--good)}
.play.mini{padding:4px 8px;font-size:12px;gap:6px;margin:4px 0 0}.play.mini i{border-left-width:8px;border-top-width:5px;border-bottom-width:5px}
.clue .play{margin-top:8px}
.listen{margin:12px 0 4px}.listen>small{display:block;font:600 10.5px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.audcredit{display:block;font-size:11px;color:var(--muted);margin-top:6px}
.homesearch{display:flex;align-items:center;gap:10px;width:100%;margin-top:18px;padding:13px 14px;border:1.5px solid var(--line);background:var(--paper);color:var(--muted);text-align:left;font-size:15px}
.homesearch::before,.gbar .search+*{}
.homesearch::before{content:"";width:14px;height:14px;border:2px solid var(--slate);border-radius:50%;box-shadow:5px 5px 0 -3px var(--slate);flex:none}
.gbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;display:flex;gap:8px;align-items:center;background:var(--bg);padding:calc(12px + env(safe-area-inset-top,0px)) 0 10px;margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.gbar .search{margin:0;flex:1;min-width:0}
.gfilter{width:42px;height:42px;border:1.5px solid var(--slate);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;flex:none}
.gfilter i{display:block;height:2px;background:var(--slate)}.gfilter i:nth-child(1){width:18px}.gfilter i:nth-child(2){width:12px}.gfilter i:nth-child(3){width:6px}
.gfilter.on{background:var(--slate)}.gfilter.on i{background:#fff}
.gchips{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:10px}
.chip{border:1.5px solid var(--line);background:var(--paper);padding:6px 10px;font-size:12.5px;font-weight:600}
.chip.on{border-color:var(--slate);background:var(--slate);color:#fff}
.gfam{margin-top:22px}
.gfh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.gfh h2{margin:0;font-size:26px}.gfh small{font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ginfo{color:var(--red);font:600 13px var(--body);padding:4px 0}
.gcards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcard{background:var(--paper);border:1px solid var(--line);padding:12px 12px 0;text-align:left;display:flex;flex-direction:column;min-width:0;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.gcard b{font:400 19px/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em;color:var(--slate)}
.gcard i{font-size:12px;color:var(--muted);margin:3px 0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gimg{display:block;margin:auto -12px 0;aspect-ratio:4/3;background:var(--soft);overflow:hidden}
.gimg img{width:100%;height:100%;object-fit:cover;display:block}
.center-txt{text-align:center;padding:40px 0}
.fhead{display:flex;align-items:center;gap:12px;background:var(--slate);color:#fff;margin:0 -16px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px}
.fhead .back{border-color:rgba(255,255,255,.5);color:#fff;background:transparent}
.fhead h1{color:#fff;font-size:30px}.fhead p{margin:2px 0 0;color:#d5dde6}
@media (prefers-color-scheme:dark){.fhead{background:#26323f}}
.fphoto{margin:0 -16px;background:#fff;min-height:220px}
.fphoto img{max-height:46vh;background:#fff}
.pdots{position:absolute;left:0;right:0;bottom:30px;display:flex;justify-content:center;gap:8px}
.pdots button{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.6);border:1px solid rgba(0,0,0,.3)}.pdots button.on{background:var(--red)}
.ftabs{display:flex;margin:0 -16px;background:var(--paper);border-bottom:1px solid var(--line)}
.ftab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 9px;color:var(--muted);border-top:3px solid transparent;font:600 10.5px var(--body);letter-spacing:.08em;text-transform:uppercase}

[hidden]{display:none!important}
#app{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--paper);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font:600 10.5px var(--body);letter-spacing:.04em;padding:4px 0}

.pbar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;background:var(--bg);margin:0 -16px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid var(--line)}
.pstat{display:flex;align-items:center;gap:6px;font:700 15px var(--body);color:var(--slate)}
.pstat.streak{color:var(--red)}.pstat b{font-weight:400}
.xpdot{width:14px;height:14px;background:var(--gold);transform:rotate(45deg);display:inline-block}
.minring{--p:0;width:20px;height:20px;border-radius:50%;background:conic-gradient(var(--good) calc(var(--p)*1%),var(--line) 0);display:inline-block}
.trail{padding-top:6px}
.unit{margin-top:22px}
.ubanner{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--slate);color:#fff;padding:14px 16px}

.uguide{width:44px;height:44px;border:1.5px solid rgba(255,255,255,.5);color:#fff;display:grid;place-items:center;flex:none}.uguide svg{width:24px;height:24px}
.unit.locked .ubanner{background:var(--line);color:var(--muted)}.unit.locked .ubanner h2{color:var(--muted)}.unit.locked .uguide{color:var(--muted);border-color:var(--muted)}
@media (prefers-color-scheme:dark){.ubanner{background:#2a3644}}
.uskip{display:block;width:100%;margin-top:6px;padding:10px;border:1.5px dashed var(--slate);color:var(--slate);font:600 13px var(--body)}
.nodes{display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px 0 8px}
.nodewrap{position:relative;transform:translateX(calc(var(--x) * 52px))}
.node{width:72px;height:68px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--line);box-shadow:0 6px 0 rgba(0,0,0,.18)}
.node svg{width:32px;height:32px}
.node.lock{color:var(--muted)}
.node.cur{background:var(--red);box-shadow:0 6px 0 #a62c11,0 0 0 8px rgba(232,64,28,.18)}
.node.done{background:var(--slate);box-shadow:0 6px 0 #26323f}
.node.gold{background:var(--gold);box-shadow:0 6px 0 #9c7512}
.node.trophy{border-radius:14px}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.bubble{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);background:var(--paper);border:2px solid var(--line);color:var(--red);font:700 12px var(--body);letter-spacing:.12em;text-transform:uppercase;padding:7px 12px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.bubble::after{content:"";position:absolute;top:100%;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--line)}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
.sheetbg{position:fixed;inset:0;z-index:40;background:rgba(10,15,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.sheet small{font:600 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sheet h2{margin:0}.sheet p{margin:0 0 6px}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.goldtag{color:var(--gold);font:400 22px var(--display);text-transform:uppercase}
.ltop{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 0 12px}
.ltop .back{font-size:16px;width:34px;height:34px}
.ltop .bar{height:12px;border-radius:8px;flex:1}.ltop .bar i{border-radius:8px;background:var(--good)}
.hearts{display:flex;align-items:center;gap:4px;font:700 16px var(--body);color:var(--red)}.hearts svg{width:22px;height:22px}
.hearts.low{animation:bob2 1s infinite}@keyframes bob2{50%{opacity:.5}}
.retry{font:700 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin:0 0 6px}
.lq{padding-bottom:40vh}
.lsheet{position:fixed;left:0;right:0;bottom:0;z-index:35;transform:translateY(100%);transition:transform .25s ease-out;background:var(--goodbg);border-top:3px solid var(--good)}
.lsheet.ko{background:var(--badbg);border-top-color:var(--red)}
.lsheet.on{transform:none}
.lsin{max-width:560px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px))}
.lsh{display:flex;align-items:center;gap:10px;font:400 26px var(--display);text-transform:uppercase;color:var(--good)}
.lsheet.ko .lsh{color:var(--red);font-size:22px}
.lsicon{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--good);color:#fff;font:700 18px var(--body);flex:none}
.lsheet.ko .lsicon{background:var(--red)}
.lsbody{max-height:48vh;overflow-y:auto;margin:6px 0 4px;-webkit-overflow-scrolling:touch}
.lsbody:empty{display:none}
.lsbody .cmp th,.lsbody .cmp td{background:transparent}
.btn.okbtn{background:var(--good);border-color:var(--good);color:#fff}.btn.kobtn{background:var(--red);border-color:var(--red);color:#fff}
.lstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin:18px 0}
.lstats div{border:1.5px solid var(--line);padding:10px;text-align:center;background:var(--paper)}
.lstats small{display:block;font:600 10.5px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lstats b{font:400 30px var(--display);color:var(--slate)}
.lend h1{font-size:44px}
.pside{display:none}

  .tabbar button.on{border-color:var(--red);background:var(--badbg)}
  .pbar{display:none}
  .pwrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:40px;align-items:start;padding-top:24px}
  .trail{max-width:600px;width:100%;justify-self:center}
  .pside{display:flex;flex-direction:column;gap:14px;position:sticky;top:24px}
  .pcard{border:1.5px solid var(--line);background:var(--paper);padding:16px}

  .pside-links{display:flex;gap:8px}.pside-links .btn{flex:1}
  .kbdhint{margin:0 4px}
  .ltop,.lq,.qtop,.q,.end{max-width:760px;margin-left:auto;margin-right:auto}
  .lq .opts,.q .opts{grid-template-columns:1fr 1fr}
  .opts{counter-reset:o}
  .opt{counter-increment:o;position:relative;padding-left:44px}
  .opt::before{content:counter(o);position:absolute;left:12px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:1.5px solid var(--line);display:grid;place-items:center;font:600 12px var(--body);color:var(--muted)}
  .opt.good::before,.opt.bad::before{border-color:rgba(255,255,255,.6);color:#fff}
  .lq{padding-bottom:30vh}
  .lsin{max-width:900px}
  .lsbody{max-height:42vh}
  .photo-wrap img{max-height:56vh}
  .grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  .chapters{grid-template-columns:1fr 1fr;column-gap:24px}
  .gcards{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
  .gbar{margin-top:0}
  .fhead{margin:0;padding:22px 24px}
  .fgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:start;margin-top:20px}
  .fphoto{margin:0;position:sticky;top:20px}
  .fphoto img{max-height:70vh}
  .ftabs{margin:0}
  .badges{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  .sosph{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .sheet{max-width:520px;margin-bottom:auto;margin-top:auto}
  .sheetbg{align-items:center}
  .top{padding-top:28px}
}
@media (min-width:960px) and (hover:hover){

}
