/* =====================================================================
   Charte « Affiche » : apps de Hugues (LeCultureClub, Ornitho Quiz, ŒnoLab…)
   Copier ce fichier tel quel en tête de l'app. Toutes les couleurs de l'app
   passent par ces variables. Modulation de cette app : ACCUEIL EN APLATS (écran Entraînement = menu de jeux)
   + LECTURE (fiches espèces : descriptions et voix en Fraunces). Ne pas changer sans raison.
   Polices (dans le <head>) :
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=League+Gothic&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
   Modulation « lecture » : ajouter &family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400
   ===================================================================== */

:root{
  /* Surfaces */
  --bg:#FAFAF7;          /* fond papier */
  --paper:#FFFFFF;       /* cartes, barres */
  --soft:#F1EFE8;        /* survol, rangées clés */
  --line:#E6E4DC;        /* filets (décoratifs uniquement) */
  --line-strong:#949186; /* bord des champs et contrôles (3,2:1) */

  /* Texte */
  --ink:#1A1A1A;         /* texte courant (16,6:1) */
  --muted:#5F6B78;       /* texte secondaire (5,2:1) — jamais plus clair */
  --slate:#3D4F63;       /* titres, structure, bandeaux (8:1) */
  --on-dark:#FFFFFF;     /* texte sur les aplats sombres (tuiles, hero) */
  --on-action:#FFFFFF;   /* texte sur fond --action (5,2:1) */
  --on-slate:#FFFFFF;    /* texte sur fond --slate (8,4:1) */
  --scrim:rgba(10,15,20,.5); /* voile derrière une fenêtre */

  /* Action */
  --action:#C8361A;      /* boutons, liens, texte vermillon (5,2:1) */
  --action-hover:#A82D15;
  --red:#E8401C;         /* vermillon affiche : grands titres (≥ 24 px), décor, jauges */
  --action-soft:#FBEAE4; /* fond de sélection, erreur douce */

  /* Statuts */
  --good:#2E7D4F; --good-bg:#E3F1E8;
  --bad:#C8361A;  --bad-bg:#FBEAE4;
  --warn:#8A6A1F; --warn-bg:#FBF3E4;

  /* Aplats (modulation « accueil » uniquement) */
  --tile-1:#3D4F63; --tile-1-ink:#FFFFFF;
  --tile-2:#C8361A; --tile-2-ink:#FFFFFF;
  --tile-3:#D9A521; --tile-3-ink:#1A1A1A;
  --tile-4:#2E5A3C; --tile-4-ink:#FFFFFF;
  --tile-5:#F1EFE8; --tile-5-ink:#3D4F63;

  /* Ajout Ornitho Quiz : or des leçons dorées (= --tile-3) */
  --gold:#D9A521; --on-gold:#1A1A1A;

  /* Visuels sombres plein cadre */
  --hero:#1A1A1A; --hero-ink:#FAFAF7; --hero-muted:#B9C3CD;

  /* Typo */
  --display:"League Gothic","Oswald","Arial Narrow",sans-serif;
  --body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;

  /* Mesures */
  --gutter:16px; --gap:12px; --tap:44px;
  --maxw-read:680px; --maxw-app:1080px; --side:240px;
  --dur:180ms; --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}

/* Mode sombre : suit le téléphone, sauf choix manuel data-theme="light" */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141A21; --paper:#1B232C; --soft:#212A34; --line:#2A3440; --line-strong:#64748A;
    --ink:#ECEAE4; --muted:#94A0AD; --slate:#A9BCCF; --on-dark:#FFFFFF; --on-action:#141A21; --on-slate:#141A21;
    --action:#FF5A36; --action-hover:#FF7A5C; --red:#FF5A36; --action-soft:#3A1D16;
    --good:#58B97E; --good-bg:#18301F; --bad:#FF5A36; --bad-bg:#3A1D16; --warn:#E0B44A; --warn-bg:#33290F;
    --tile-1:#2A3644; --tile-2:#B83218; --tile-3:#C9971C; --gold:#C9971C; --tile-4:#26492F; --tile-5:#212A34; --tile-5-ink:#A9BCCF;
    --hero:#0E1318;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141A21; --paper:#1B232C; --soft:#212A34; --line:#2A3440; --line-strong:#64748A;
  --ink:#ECEAE4; --muted:#94A0AD; --slate:#A9BCCF; --on-dark:#FFFFFF; --on-action:#141A21; --on-slate:#141A21;
  --action:#FF5A36; --action-hover:#FF7A5C; --red:#FF5A36; --action-soft:#3A1D16;
  --good:#58B97E; --good-bg:#18301F; --bad:#FF5A36; --bad-bg:#3A1D16; --warn:#E0B44A; --warn-bg:#33290F;
  --tile-1:#2A3644; --tile-2:#B83218; --tile-3:#C9971C; --gold:#C9971C; --tile-4:#26492F; --tile-5:#212A34; --tile-5-ink:#A9BCCF;
  --hero:#0E1318;
  color-scheme:dark;
}

/* ---------- Base ---------- */
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom)}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--action)}
:focus-visible{outline:2px solid var(--action);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* ---------- Typographie ---------- */
.display,h1,h2{font-family:var(--display);font-weight:400;text-transform:uppercase;letter-spacing:.02em;line-height:.95;color:var(--slate);margin:0;text-wrap:balance}
h1{font-size:clamp(34px,6vw,56px)}
h2{font-size:clamp(26px,4vw,34px);margin:32px 0 12px}
h3{font:600 17px/1.3 var(--body);margin:20px 0 6px;color:var(--ink)}
.eyebrow{font:600 11px/1.2 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.eyebrow.action{color:var(--action)}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;line-height:1;color:var(--slate)}
.muted{color:var(--muted)} .small{font-size:14px}
.tabular{font-variant-numeric:tabular-nums}

/* Modulation lecture */
.prose{font:18px/1.65 var(--serif);max-width:var(--maxw-read)}
.prose p{margin:0 0 14px} .prose em,.lede{font-style:italic}
.lede{font:italic 19px/1.5 var(--serif);color:var(--muted);max-width:60ch}
blockquote{margin:16px 0;padding:12px 16px;border-left:4px solid var(--red);background:var(--paper);font:italic 18px/1.55 var(--serif)}

/* ---------- Boutons et contrôles ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:10px 18px;
  border:1.5px solid var(--slate);background:var(--paper);color:var(--slate);border-radius:0;
  font:600 13px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.btn.primary{background:var(--action);border-color:var(--action);color:var(--on-action)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.wide{width:100%}
.btn[aria-busy="true"]{opacity:.7;pointer-events:none}
@media (hover:hover){.btn:hover{background:var(--soft)}.btn.primary:hover{background:var(--action-hover);border-color:var(--action-hover)}}
.btn:active{transform:translateY(1px)}
.icon-btn{width:var(--tap);height:var(--tap);display:grid;place-items:center;border:1.5px solid var(--slate);color:var(--slate);background:transparent;border-radius:0}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font:600 13px var(--body);color:var(--ink)}
.field .hint{font-size:13px;color:var(--muted)}
.field .error{font-size:13px;color:var(--bad);font-weight:600}
.input,select.input,textarea.input{min-height:var(--tap);padding:10px 12px;border:1.5px solid var(--line-strong);background:var(--paper);border-radius:0;width:100%}
.input:focus{border-color:var(--slate);outline:none;box-shadow:inset 0 0 0 1px var(--slate)}
.input[aria-invalid="true"]{border-color:var(--bad)}

.chip{min-height:36px;padding:6px 12px;border:1.5px solid var(--line-strong);background:var(--paper);border-radius:0;font:600 13px var(--body)}
.chip[aria-pressed="true"]{background:var(--slate);border-color:var(--slate);color:var(--on-slate)}
.tag{display:inline-block;padding:3px 8px;font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;border:1px solid currentColor;color:var(--slate)}
.tag.action{background:var(--action);border-color:var(--action);color:var(--on-action)}

/* ---------- Mise en page ---------- */
.app{max-width:var(--maxw-app);margin:0 auto;padding:0 max(var(--gutter),env(safe-area-inset-left)) calc(96px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  min-height:56px;padding:calc(8px + env(safe-area-inset-top)) var(--gutter) 8px;margin:0 calc(-1 * var(--gutter));
  background:var(--paper);border-bottom:1px solid var(--line)}
.wordmark{font:400 28px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;color:var(--slate);text-decoration:none}
.wordmark em{font-style:normal;color:var(--red)}

/* Barre d'onglets (téléphone) qui devient menu latéral (PC) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--paper);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom))}
.tabbar a,.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:var(--tap);padding:4px 0;
  border:0;background:none;color:var(--muted);font:600 11px var(--body);letter-spacing:.04em;text-decoration:none}
.tabbar svg{width:24px;height:24px}
.tabbar [aria-current="page"]{color:var(--action)}

/* Listes à filets (préférer aux cartes) */
.rows{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:12px 2px;border-bottom:1px solid var(--line);
  color:inherit;text-decoration:none;background:none;width:100%;text-align:left}
.row .title{font:400 21px/1.05 var(--display);text-transform:uppercase;color:var(--slate)}
@media (hover:hover){a.row:hover,button.row:hover{background:var(--soft)}}

/* Grille de chiffres */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.stats>div{background:var(--paper);padding:14px}
.stats .num{font-size:34px}

/* Visuel plein cadre */
.hero{position:relative;background:var(--hero);color:var(--hero-ink);margin:0 calc(-1 * var(--gutter));min-height:220px;
  display:flex;flex-direction:column;justify-content:flex-end;padding:20px var(--gutter);overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55;filter:grayscale(.3)}
.hero>*{position:relative}
.hero h1{color:var(--hero-ink)} .hero .muted{color:var(--hero-muted)}

/* Modulation accueil : aplats */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:0}
.tile{min-height:120px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;border:0;text-align:left;
  background:var(--tile-1);color:var(--tile-1-ink)}
.tile:nth-child(5n+2){background:var(--tile-2);color:var(--tile-2-ink)}
.tile:nth-child(5n+3){background:var(--tile-3);color:var(--tile-3-ink)}
.tile:nth-child(5n+4){background:var(--tile-4);color:var(--tile-4-ink)}
.tile:nth-child(5n+5){background:var(--tile-5);color:var(--tile-5-ink)}
.tile svg{width:28px;height:28px}
.tile b{font:400 24px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.tile small{font-size:13px;opacity:.9}
@media (hover:hover){.tile:hover{filter:brightness(1.08)}}

/* États */
.empty{border:1.5px dashed var(--line-strong);padding:24px;text-align:left}
.empty b{display:block;font:400 24px/1 var(--display);text-transform:uppercase;color:var(--slate);margin-bottom:6px}
.skeleton{background:var(--soft);animation:sk 1.2s ease-in-out infinite;min-height:1em}
@keyframes sk{50%{background:var(--line)}}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-left:4px solid var(--warn);background:var(--warn-bg);color:var(--ink)}
.banner.bad{border-left-color:var(--bad);background:var(--bad-bg)}
.banner.good{border-left-color:var(--good);background:var(--good-bg)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:50;
  display:flex;gap:14px;align-items:center;max-width:min(92vw,480px);padding:12px 16px;background:var(--slate);color:var(--on-slate);font:600 14px var(--body);
  transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast button{background:none;border:0;color:var(--on-slate);text-decoration:underline;font-weight:700;min-height:32px}

/* Feuille du bas (téléphone) qui devient fenêtre centrée (PC) */
.sheet-bg{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:90dvh;overflow:auto;padding:20px var(--gutter) calc(20px + env(safe-area-inset-bottom));border-top:4px solid var(--slate)}

/* Mouvement réduit */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------- PC (≥ 960 px) ---------- */
@media (min-width:960px){
  body:has(.tabbar){padding-left:var(--side)}
  .app{padding:0 32px 48px}
  .tabbar{top:0;bottom:0;right:auto;width:var(--side);flex-direction:column;justify-content:flex-start;gap:2px;border-top:0;border-right:1px solid var(--line);padding:24px 14px}
  .tabbar a,.tabbar button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 12px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;border-left:3px solid transparent}
  .tabbar [aria-current="page"]{border-left-color:var(--action);background:var(--soft);color:var(--ink)}
  .topbar{margin:0;padding:12px 0}
  .hero{margin:0;min-height:320px;padding:32px}
  .tiles{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  .tile{min-height:160px}
  .split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:40px;align-items:start}
  .split>aside{position:sticky;top:24px}
  .sheet-bg{align-items:center}
  .sheet{border-top-width:4px;max-height:80vh}
  .toast{bottom:24px}
}

/* =====================================================================
   Ornitho Quiz : composants propres à l'app (tout passe par les variables de la charte)
   ===================================================================== */
/* Bandeaux ardoise : en mode sombre ils passent en ardoise foncée (l'ardoise claire du mode sombre est faite pour le texte) */
:root{--band:var(--slate);--on-band:var(--on-slate)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--band:var(--tile-1);--on-band:var(--on-dark)}}
:root[data-theme="dark"]{--band:var(--tile-1);--on-band:var(--on-dark)}
.phero{padding:8px 0 6px}
#app{max-width:560px;margin:0 auto;padding:0 max(var(--gutter),env(safe-area-inset-left)) calc(96px + env(safe-area-inset-bottom))}
h1,h2,.rname,.prompt,.wordmark,.tile b,.level b,.chap>span:first-child,.badge b,.fbh{font-family:var(--display);font-weight:400;text-transform:uppercase;letter-spacing:.02em;color:var(--slate)}
h1{font-size:clamp(34px,6vw,48px);line-height:.95}
h2{font-size:28px;margin:32px 0 12px;line-height:1}
h3{font:600 11px/1.2 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:20px 0 10px}
.small{font-size:14px} i{font-style:italic}
button{border:0;background:none;padding:0;color:inherit}
.btn{padding:10px 16px;text-align:center}
.btn.small{min-height:36px;padding:8px 12px;font-size:12px;margin-top:8px}
.btn.wide{margin-top:14px}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.okbtn{background:var(--good);border-color:var(--good);color:var(--on-action)}
.btn.kobtn{background:var(--action);border-color:var(--action);color:var(--on-action)}
.link{color:var(--action);text-decoration:underline;font-size:inherit}
.row2{display:flex;gap:10px;flex-wrap:wrap}.row2 .btn{flex:1}
.foot{margin-top:32px;font-size:13px}
.center{display:grid;place-items:center;min-height:70vh;text-align:center}
.center-txt{text-align:center;padding:40px 0}
.loadsk{display:grid;gap:12px;padding-top:calc(24px + env(safe-area-inset-top))}
.loadsk .skeleton{height:18px}.loadsk .skeleton.ph{height:auto;aspect-ratio:4/3}.loadsk p{margin:0}
.spinner{width:44px;height:6px;background:var(--line);position:relative;overflow:hidden}
.spinner::after{content:"";position:absolute;inset:0;width:40%;background:var(--red);animation:slide 1s var(--ease) infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}

/* Hors connexion */
#offline{position:fixed;top:0;left:0;right:0;z-index:70;font-size:14px;padding-top:calc(10px + env(safe-area-inset-top))}

/* Écrans simples */
.top{display:flex;align-items:center;gap:12px;padding:calc(18px + env(safe-area-inset-top)) 0 10px}
.back{width:var(--tap);height:var(--tap);border:1.5px solid var(--slate);color:var(--slate);font-size:22px;line-height:1;flex:none;display:grid;place-items:center}
.qtop{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 0 12px;position:sticky;top:0;background:var(--bg);z-index:3}
.qtop>b{font:400 20px var(--display);text-transform:uppercase;color:var(--slate)}
.combo{font:400 24px var(--display);color:var(--red);min-width:42px;text-align:right}.combo.ghost{color:var(--muted);font:600 12px var(--body);letter-spacing:.1em}

/* Entraînement */
.goal{display:flex;align-items:center;gap:14px;background:var(--band);color:var(--on-band);padding:16px;margin-top:12px}
.goal b{font:400 24px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.goal .muted{color:inherit;opacity:.85;font-size:13px}
.goal .btn{margin-left:auto}
.ring{--p:0;width:56px;height:56px;border-radius:50%;background:conic-gradient(var(--red) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{background:var(--band);color:var(--on-band);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--body)}
.pcard .ring span{background:var(--paper);color:var(--slate)}
.homesearch{display:flex;align-items:center;gap:10px;width:100%;min-height:var(--tap);margin-top:16px;padding:12px 14px;border:1.5px solid var(--line-strong);background:var(--paper);color:var(--muted);text-align:left;font-size:16px}
.homesearch svg,.gbar .sicon{width:18px;height:18px;color:var(--slate);flex:none}
.tiles{margin-top:4px}
.tile{gap:6px;min-height:132px;position:relative}
.tile .ti{width:30px;height:30px;--ic-accent:currentColor}.tile .ti svg{width:100%;height:100%}
.tile b{font-size:24px;line-height:1;color:inherit}
.tile small{line-height:1.35}
.tile em{font:700 11px var(--body);font-style:normal;letter-spacing:.1em;text-transform:uppercase;margin-top:auto}
.chapters{display:grid;border-top:1px solid var(--line)}
.chap{border-bottom:1px solid var(--line);padding:13px 2px;display:grid;grid-template-columns:1fr auto;text-align:left;gap:3px 10px;min-height:56px}
.chap>span:first-child{font-size:22px;line-height:1.05}
.stars{color:var(--red);letter-spacing:3px;font-size:14px}.stars i{color:var(--line-strong);font-style:normal}
.chap small{color:var(--muted);font-size:13px}
.mbar{grid-column:1/-1;height:3px;background:var(--line);overflow:hidden;margin-top:6px}.mbar i{display:block;height:100%;background:var(--slate)}
@media (hover:hover){.chap:hover,.sprow:hover{background:var(--soft)}}

/* Photos */
.photo-wrap{background:var(--hero);overflow:hidden;position:relative}
.pframe{position:relative;width:100%;aspect-ratio:4/3;max-height:52vh;overflow:hidden;background:var(--hero);display:flex;align-items:center;justify-content:center}
.pframe .pbg{position:absolute;inset:-20px;width:calc(100% + 40px);height:calc(100% + 40px);object-fit:cover;filter:blur(18px) brightness(.55);transform:scale(1.05)}
.pframe .pfg{position:relative;display:block;width:100%;height:100%;object-fit:contain}
.photo-wrap.small .pframe{max-height:30vh}
.credit{font-size:11px;color:var(--hero-muted);padding:0 10px;height:28px;line-height:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--hero)}
.credit a,.credit .link{color:var(--hero-ink);font-size:11px}
.ph-loading,.ph-none{color:var(--hero-muted);padding:40px 16px;text-align:center;font:600 12px var(--body);letter-spacing:.12em;text-transform:uppercase}
.pnav{position:absolute;left:0;right:0;top:0;bottom:28px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.parr{pointer-events:auto;width:var(--tap);height:64px;background:var(--scrim);color:var(--on-dark);font-size:34px;line-height:1;display:flex;align-items:center;justify-content:center;transition:background var(--dur) var(--ease)}
.parr:active{background:var(--hero)}
.pcount{position:absolute;top:0;right:0;background:var(--hero);color:var(--hero-ink);font:400 18px/1 var(--display);letter-spacing:.06em;padding:6px 10px}
#fph{touch-action:pan-y}

/* Questions */
.prompt{font-size:32px;margin:18px 0 6px;line-height:1}
.hint{color:var(--muted);font:600 11px var(--body);letter-spacing:.14em;text-transform:uppercase;margin:0 0 6px}
blockquote{font:17px/1.55 var(--body);font-style:normal}
.opts{display:grid;gap:8px;margin-top:16px}
.opt{background:var(--paper);border:1.5px solid var(--line-strong);min-height:52px;padding:14px 16px;text-align:left;font-weight:600;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.opt.it{font-style:italic;font-weight:500}
.opt.long{font-size:14px;line-height:1.4;font-weight:500;padding:12px 14px}
.opt.good{background:var(--good);border-color:var(--good);color:var(--on-action)}
.opt.good::after{content:" ✓"}
.opt.bad{background:var(--action);border-color:var(--action);color:var(--on-action);animation:shake .35s}
.opt.bad::after{content:" ✗"}
.opt.dim{opacity:.45}
.opt:active{background:var(--soft)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fbcard{margin-top:18px;padding:16px;background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--good)}
.fbcard.ko{border-top-color:var(--bad)}
.fbh{font-size:28px;line-height:1;margin-bottom:10px}.fbcard.ok .fbh{color:var(--good)}.fbcard.ko .fbh{color:var(--bad)}
.fbcard p{margin:8px 0}.fbcard .photo-wrap{margin:6px 0 12px}
.path{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11px;margin:8px 0}
.path span{border:1px solid var(--slate);color:var(--slate);padding:3px 8px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.path b{color:var(--muted);font-weight:400}
.why{margin:4px 0 10px;font-size:15px}
.duo{display:grid;gap:8px;margin:8px 0}
.duo>div{padding:10px 12px;font-size:14px;line-height:1.45;border-left:4px solid var(--line);background:var(--soft)}
.duo small{display:block;font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;margin-bottom:3px}
.duo .w{border-left-color:var(--bad)}.duo .w small{color:var(--bad)}.duo .r{border-left-color:var(--good)}.duo .r small{color:var(--good)}
.cmpwrap{overflow-x:auto;margin:8px 0}
.cmp{width:100%;border-collapse:collapse;font-size:14px;line-height:1.35;table-layout:fixed}
.cmp th,.cmp td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp thead th{font:600 13px var(--body);color:var(--ink)}
.cmp thead th small,.cmp tbody th small{display:block;font:600 10px var(--body);letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.cmp thead th.w small{color:var(--bad)}.cmp thead th.r small{color:var(--good)}
.cmp tbody th{width:28%;font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cmp tr.key{background:var(--soft)}.cmp tr.key th{color:var(--slate)}.cmp tr.key th small{color:var(--action)}
.cmp tr.key td{font-weight:600}
.retiens{margin:10px 0 4px;padding:10px 12px;border:1.5px solid var(--slate);font-size:14px}
.retiens b{display:block;font:400 18px var(--display);text-transform:uppercase;color:var(--slate);margin-bottom:2px}
.clues{display:grid;gap:6px;margin:10px 0}
.clue{background:var(--paper);border-left:4px solid var(--slate);padding:9px 12px;font-size:15px}
.clue:last-child{border-left-color:var(--red)}
.clue small{display:block;font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.readorder{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0}
.readorder small{width:100%;font:600 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.readorder span{border:1.5px solid var(--slate);color:var(--slate);padding:5px 9px;font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center}
.readorder span b{color:var(--action)}

/* Fin de partie */
.end{text-align:center;padding-top:calc(34px + env(safe-area-inset-top))}
.end .big{font:600 13px var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.end h1{font-size:88px;color:var(--slate)}.end .splist{text-align:left}.end .row2{margin-top:24px}
.newstar{font:400 40px var(--display);color:var(--red);margin:12px 0}.newstar small{font:600 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.splist{display:grid;border-top:1px solid var(--line)}
.sprow{border-bottom:1px solid var(--line);padding:11px 2px;display:flex;align-items:center;justify-content:space-between;text-align:left;gap:10px;min-height:52px}
.sprow small{color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase}.sprow i{color:var(--muted);font-size:13px}
.dots{display:flex;gap:3px;flex:none}.dots i{width:8px;height:8px;background:var(--line)}.dots i.on{background:var(--slate)}
.dot.new{font:700 10px var(--body);color:var(--action);letter-spacing:.12em;text-transform:uppercase;flex:none}
.levels{display:grid;gap:8px;margin-top:14px}
.level{background:var(--paper);border:1.5px solid var(--line-strong);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px}
.level b{font-size:24px;line-height:1}.level small{color:var(--muted)}.level.done{border-color:var(--slate);border-left-width:4px}.level.locked{opacity:.5}
.block{background:var(--paper);border:1px solid var(--line);padding:14px 16px;margin-top:12px}
.block h4{margin:0 0 8px;font:600 11px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.block p{margin:4px 0}
.block.fam{border-left:4px solid var(--slate)}
.sci{font-style:italic;color:var(--muted);margin:0 0 12px 50px}
.search{width:100%;min-height:var(--tap);padding:12px 14px;border:1.5px solid var(--line-strong);background:var(--paper);color:var(--ink);font:16px var(--body);margin:8px 0;border-radius:0}
.search:focus{border-color:var(--slate);outline:none;box-shadow:inset 0 0 0 1px var(--slate)}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:12px}
.badge{background:var(--paper);padding:16px;text-align:center;opacity:.45;filter:grayscale(1);display:flex;flex-direction:column;gap:2px}
.badge.on{opacity:1;filter:none}.badge span{font-size:28px}.badge b{font-size:22px}.badge small{color:var(--muted);font-size:12px}
.timer{position:relative;height:28px;background:var(--line);overflow:hidden;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font:700 13px var(--body)}
.timer i{position:absolute;left:0;top:0;bottom:0;background:var(--red);transition:width .2s linear;z-index:0}.timer span,.timer b{position:relative}
.pairs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.pc{background:var(--paper);border:1.5px solid var(--line-strong);padding:10px 6px;min-height:80px;font-size:13px;font-weight:600;line-height:1.2}
.pc.fam{color:var(--slate);text-transform:uppercase;letter-spacing:.06em;font-size:11.5px}.pc.sci{font-style:italic;font-weight:500;color:var(--slate)}
.pc.sel{border-color:var(--action);border-width:3px;padding:8px 4px}
.pc.found{background:var(--slate);color:var(--on-slate);border-color:var(--slate);opacity:.35}
.pc.shake{animation:shake .35s;border-color:var(--bad)}
.ladder{display:flex;gap:4px;flex:1}.ladder i{flex:1;height:4px;background:var(--line)}.ladder i.on{background:var(--slate)}.ladder i.cur{background:var(--red)}

/* Notifications et feuilles (noms historiques de l'app) */
.toast{bottom:calc(84px + env(safe-area-inset-bottom));text-align:center;justify-content:center}
.toast.big{font:400 24px var(--display);text-transform:uppercase;letter-spacing:.02em;padding:14px 22px;background:var(--action);color:var(--on-action)}
.sheetbg{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheetbg .sheet{display:flex;flex-direction:column;gap:8px}
.sheet small{font:600 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sheet h2{margin:0}.sheet p{margin:0 0 6px}
.goldtag{color:var(--warn);font:400 22px var(--display);text-transform:uppercase}

/* Sosies */
.duels{display:grid;gap:0}
.sosph{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.sosph figure{margin:0}.sosph figcaption{font-size:13px;font-weight:600;margin-top:4px}
.sosph .pframe{max-height:140px}
.dimblock p{margin:6px 0;font-size:14px}.dimblock p b{display:block;font-size:12px;color:var(--slate);text-transform:uppercase;letter-spacing:.06em}
.pswitch{margin:10px 0}
.ptabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin-top:6px}
.ptab{border:1.5px solid var(--line-strong);background:var(--paper);padding:8px 10px;text-align:left;font-weight:600;font-size:14px;line-height:1.2;min-height:var(--tap)}
.ptab small{display:block;font:600 10px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.ptab.w small{color:var(--bad)}.ptab.r small{color:var(--good)}
.ptab.on{border-color:var(--slate);border-bottom-width:4px}
.ptab.w.on{border-color:var(--bad)}.ptab.r.on{border-color:var(--good)}
.ptip{margin:4px 0 0}

/* Sons */
.play{display:inline-flex;align-items:center;gap:10px;min-height:var(--tap);border:1.5px solid var(--slate);background:var(--paper);color:var(--slate);padding:10px 14px;font:600 14px var(--body);margin:6px 6px 0 0;text-align:left}
.play i{width:0;height:0;border-left:11px solid currentColor;border-top:7px solid transparent;border-bottom:7px solid transparent;flex:none}
.play.playing i{width:11px;height:13px;border:0;border-left:4px solid currentColor;border-right:4px solid currentColor}
.play.loading{opacity:.6}
.play.big{width:100%;justify-content:center;background:var(--band);color:var(--on-band);border-color:var(--band);padding:16px;font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin:12px 0 0}
.play.w{border-color:var(--bad);color:var(--bad)}.play.r{border-color:var(--good);color:var(--good)}
.play.mini{min-height:32px;padding:4px 8px;font-size:12px;gap:6px;margin:4px 0 0}.play.mini i{border-left-width:8px;border-top-width:5px;border-bottom-width:5px}
.clue .play{margin-top:8px}
.listen{margin:12px 0 4px}.listen>small{display:block;font:600 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.audcredit{display:block;font-size:11px;color:var(--muted);margin-top:6px}

/* Guide */
.gbar{position:sticky;top:0;z-index:4;display:flex;gap:8px;align-items:center;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 0 10px}
.gbar .search{margin:0;flex:1;min-width:0}
.gfilter{width:var(--tap);height:var(--tap);border:1.5px solid var(--slate);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;flex:none}
.gfilter i{display:block;height:2px;background:var(--slate)}.gfilter i:nth-child(1){width:18px}.gfilter i:nth-child(2){width:12px}.gfilter i:nth-child(3){width:6px}
.gfilter.on{background:var(--slate)}.gfilter.on i{background:var(--on-slate)}
.gchips{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:10px}
.chip.on{background:var(--slate);border-color:var(--slate);color:var(--on-slate)}
.gfam{margin-top:22px}
.gfh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.gfh h2{margin:0;font-size:26px}.gfh small{font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ginfo{color:var(--action);font:600 13px var(--body);min-height:var(--tap);padding:4px 0}
.gcards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcard{background:var(--paper);border:1px solid var(--line);padding:12px 12px 0;text-align:left;display:flex;flex-direction:column;min-width:0}
.gcard b{font:400 19px/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em;color:var(--slate)}
.gcard i{font-size:12px;color:var(--muted);margin:3px 0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gimg{display:block;margin:auto -12px 0;aspect-ratio:4/3;background:var(--soft);overflow:hidden}
.gimg img{width:100%;height:100%;object-fit:cover;display:block}

/* Fiche espèce */
.fhead{display:flex;align-items:center;gap:12px;background:var(--band);color:var(--on-band);margin:0 calc(-1 * var(--gutter));padding:calc(14px + env(safe-area-inset-top)) var(--gutter) 14px}
.fhead .back{border-color:currentColor;color:inherit;background:transparent}
.fhead h1{color:inherit;font-size:32px}.fhead p{margin:2px 0 0;opacity:.85}
.fphoto{margin:0 calc(-1 * var(--gutter))}
.fphoto .pframe{max-height:none}
.ftabs{display:flex;margin:0 calc(-1 * var(--gutter));background:var(--paper);border-bottom:1px solid var(--line)}
.ftab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;padding:10px 4px 9px;color:var(--muted);border-top:3px solid transparent;font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase}
.ftab svg{width:24px;height:24px}
.ftab.on{color:var(--slate);border-top-color:var(--slate)}
.fbody{padding:16px 0}
.ftext{font:18px/1.65 var(--serif);max-width:var(--maxw-read);margin:12px 0}
.fsound .play.flat{border:0;padding:6px 0;background:none;color:var(--muted);font-style:italic;font-weight:500}
.autonote{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.45}.autonote a{color:inherit}

/* Barre d'onglets (téléphone) / menu latéral (PC) */
.tabbar button{gap:2px}
.tabbar button[aria-current="page"]{color:var(--action)}
.tlogo{display:none}

/* Chemin */
.pbar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;background:var(--paper);margin:0 calc(-1 * var(--gutter));padding:calc(8px + env(safe-area-inset-top)) var(--gutter) 8px;min-height:56px;border-bottom:1px solid var(--line)}
.pbar .wordmark{font-size:26px}.wordmark em{font-style:normal;color:var(--red)}
.pstats{display:flex;gap:16px;align-items:baseline}
.pstat{display:flex;align-items:baseline;gap:5px;font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pstat b{font:400 24px/1 var(--display);letter-spacing:.02em;color:var(--slate)}
.pstat.streak b{color:var(--red)}
.trail{padding-top:4px}
.unit{margin-top:24px}
.ubanner{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--band);color:var(--on-band);padding:14px 16px}
.ubanner small{font:600 11px var(--body);letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.ubanner h2{color:inherit;margin:2px 0;font-size:28px}.ubanner p{margin:0;font-size:13px;opacity:.85}
.uguide{width:var(--tap);height:var(--tap);border:1.5px solid currentColor;display:grid;place-items:center;flex:none}.uguide svg{width:24px;height:24px}
.unit.locked .ubanner{background:var(--soft);color:var(--muted)}
.uskip{display:block;width:100%;min-height:var(--tap);margin-top:8px;padding:10px;border:1.5px dashed var(--line-strong);color:var(--slate);font:600 13px var(--body)}
@media (hover:hover){.uskip:hover{background:var(--soft)}}
.stations{list-style:none;margin:0;padding:8px 0 0;position:relative}
.stations::before{content:"";position:absolute;left:27px;top:8px;bottom:28px;width:2px;background:var(--line)}
.station{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:72px;padding:10px 0;text-align:left;border-bottom:1px solid var(--line)}
.station:last-child{border-bottom:0}
.sq{width:56px;height:56px;flex:none;display:grid;place-items:center;background:var(--paper);border:1.5px solid var(--line-strong);color:var(--muted);position:relative;z-index:1;--ic-accent:currentColor}
.sq svg{width:28px;height:28px}
.st-l{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.st-l b{font:400 22px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;color:var(--slate)}
.st-l small{font-size:13px;color:var(--muted)}
.st-s{font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);flex:none;text-align:right}
.station.done .sq{background:var(--slate);border-color:var(--slate);color:var(--on-slate)}
.station.gold .sq{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.station.gold .st-s{color:var(--warn)}
.station.cur{background:var(--action-soft);margin:0 calc(-1 * var(--gutter));padding-left:var(--gutter);padding-right:var(--gutter);width:calc(100% + 2 * var(--gutter))}
.station.cur .sq{background:var(--action);border-color:var(--action);color:var(--on-action)}
.station.cur .st-s{color:var(--action)}
.station.lock .st-l b{color:var(--muted)}
.station.trophy .sq{width:56px;height:56px;border-width:3px}
@media (hover:hover){.station:not(.lock):not(.cur):hover{background:var(--soft)}}
.pside{display:none}

/* Leçon */
.ltop{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 0 12px}
.ltop .back{font-size:16px}
.bar{height:6px;background:var(--line);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:var(--red);transition:width .5s var(--ease)}
.ltop .bar{height:10px;flex:1;margin:0}.ltop .bar i{background:var(--good)}
.hearts{display:flex;align-items:center;gap:4px;font:400 24px/1 var(--display);color:var(--action)}.hearts svg{width:22px;height:22px}
.hearts.low{animation:bob2 1s infinite}@keyframes bob2{50%{opacity:.5}}
.retry{font:700 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--action);margin:0 0 6px}
.lq{padding-bottom:40vh}
.lsheet{position:fixed;left:0;right:0;bottom:0;z-index:35;transform:translateY(100%);transition:transform .25s var(--ease);background:var(--good-bg);border-top:4px solid var(--good)}
.lsheet.ko{background:var(--bad-bg);border-top-color:var(--bad)}
.lsheet.on{transform:none}
.lsin{max-width:560px;margin:0 auto;padding:14px max(var(--gutter),env(safe-area-inset-left)) calc(14px + env(safe-area-inset-bottom))}
.lsh{display:flex;align-items:center;gap:10px;font:400 26px var(--display);text-transform:uppercase;color:var(--good)}
.lsheet.ko .lsh{color:var(--bad);font-size:22px}
.lsicon{width:32px;height:32px;display:grid;place-items:center;background:var(--good);color:var(--on-action);font:700 18px var(--body);flex:none}
.lsheet.ko .lsicon{background:var(--bad)}
.lsbody{max-height:48vh;overflow-y:auto;margin:6px 0 4px;-webkit-overflow-scrolling:touch}
.lsbody:empty{display:none}
.lsbody .cmp th,.lsbody .cmp td{background:transparent}
.lstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:18px 0}
.lstats div{padding:12px;text-align:center;background:var(--paper)}
.lstats small{display:block;font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lstats b{font:400 32px var(--display);color:var(--slate)}
.lend h1{font-size:44px}
.rank{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.rname{font-size:44px;line-height:.95}.rname em{font-style:normal;color:var(--red)}
.rsub{font:600 11px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.rnext{font-size:13px;color:var(--muted);margin-top:8px}

/* ---------- PC ---------- */
@media (min-width:960px){
  #app{max-width:1060px;padding:0 32px 40px}
  .tlogo{display:block;font:400 30px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;color:var(--slate);padding:0 12px 24px}
  .tabbar button{width:100%}
  .pbar{display:none}
  .pwrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:40px;align-items:start;padding-top:24px}
  .trail{max-width:640px;width:100%}
  .unit:first-child{margin-top:0}
  .station.cur{margin:0 -16px;padding-left:16px;padding-right:16px;width:calc(100% + 32px)}
  .pside{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);position:sticky;top:24px}
  .pcard{background:var(--paper);padding:16px}
  .pcard>small{display:block;font:600 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .pcard h3{font:400 32px/1 var(--display);text-transform:uppercase;color:var(--slate);margin:0;letter-spacing:.02em}
  .pcard .bar{margin-top:8px}
  .pcard .btn.wide{margin-top:12px}
  .prow{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .pside-links{display:flex;gap:8px}.pside-links .btn{flex:1}
  .kbdhint{background:var(--paper);margin:0;padding:12px 16px 16px}
  .ltop,.lq,.qtop,.q,.end{max-width:760px;margin-left:auto;margin-right:auto}
  .lq .opts,.q .opts{grid-template-columns:1fr 1fr}
  .opts{counter-reset:o}
  .opt{counter-increment:o;position:relative;padding-left:46px}
  .opt::before{content:counter(o);position:absolute;left:12px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:1.5px solid var(--line-strong);display:grid;place-items:center;font:600 12px var(--body);color:var(--muted)}
  .opt.good::before,.opt.bad::before{border-color:currentColor;color:inherit}
  .lq{padding-bottom:30vh}
  .lsin{max-width:900px}
  .lsbody{max-height:42vh}
  .pframe{max-height:56vh}
  .chapters{grid-template-columns:1fr 1fr;column-gap:24px}
  .gcards{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
  .fhead{margin:0;padding:22px 24px}
  .fgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;align-items:start;margin-top:24px}
  .fphoto{margin:0;position:sticky;top:24px}
  .ftabs{margin:0}
  .badges{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  .sosph{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .sheetbg{align-items:center}
  .sheetbg .sheet{max-width:520px}
  .top{padding-top:28px}
  .toast{bottom:24px}
}
@media (min-width:960px) and (hover:hover){
  .opt:hover:not(.good):not(.bad):not(.dim){border-color:var(--slate);background:var(--soft)}
  .gcard:hover{background:var(--soft)}
  .tabbar button:hover:not([aria-current="page"]){background:var(--soft)}
  .parr:hover{background:var(--hero)}
}
.row2 .chip{flex:1;min-height:var(--tap)}
</style>
</head>
<body>
<main id="app"><div class="center" aria-busy="true"><div><p class="wordmark" style="font-size:44px;margin:0 0 14px">Ornitho<em>Quiz</em></p><div class="spinner" style="margin:0 auto"></div></div></div></main>
<script src="sosies.js"></script>
<script src="app.js"></script>
</body>
</html>
